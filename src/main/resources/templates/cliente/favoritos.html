<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus favoritos | Cupcakes Gourmet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-rose-50 text-slate-800">
<header class="bg-rose-600 text-white shadow">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
        <h1 class="text-2xl font-bold">Cupcakes Gourmet</h1>
        <nav class="flex gap-3 text-sm">
            <a th:href="@{/cliente/pedidos}" class="rounded-full bg-white/15 px-4 py-2 hover:bg-white/25">Meus pedidos</a>
            <a th:href="@{/catalogo}" class="rounded-full bg-white/15 px-4 py-2 hover:bg-white/25">Catálogo</a>
        </nav>
    </div>
</header>
<main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8">
        <p class="text-sm font-semibold uppercase tracking-wider text-rose-600">Painel do cliente</p>
        <h2 class="mt-2 text-3xl font-extrabold">Meus favoritos</h2>
    </div>

    <p th:if="${sucesso}" th:text="${sucesso}" class="mb-4 rounded-lg bg-green-100 p-3 text-green-800"></p>
    <p th:if="${erro}" th:text="${erro}" class="mb-4 rounded-lg bg-red-100 p-3 text-red-800"></p>

    <div th:if="${#lists.isEmpty(favoritos)}" class="rounded-2xl bg-white p-10 text-center shadow-sm">
        <p class="text-lg text-slate-600">Você ainda não salvou nenhum cupcake.</p>
        <a th:href="@{/catalogo}" class="mt-5 inline-block rounded-lg bg-rose-600 px-5 py-3 font-semibold text-white hover:bg-rose-700">Explorar catálogo</a>
    </div>

    <div th:unless="${#lists.isEmpty(favoritos)}" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <article th:each="favorito : ${favoritos}"
                 class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-rose-100">
            <img th:src="${favorito.cupcake.fotoUrl ?: 'https://images.unsplash.com/photo-1587668178277-295251f900ce?w=800'}"
                 th:alt="${favorito.cupcake.nome}" class="h-48 w-full object-cover">
            <div class="p-5">
                <div class="flex items-start justify-between gap-3">
                    <h3 class="text-xl font-bold" th:text="${favorito.cupcake.nome}">Red Velvet</h3>
                    <span class="whitespace-nowrap font-bold text-rose-600"
                          th:text="${'R$ ' + #numbers.formatDecimal(favorito.cupcake.preco, 1, 2)}">R$ 12,00</span>
                </div>
                <p class="mt-3 text-sm text-slate-600" th:text="${favorito.cupcake.descricao}">Descrição</p>
                <div class="mt-5 flex gap-2">
                    <form th:action="@{/carrinho/adicionar}" method="post" class="flex-1">
                        <input type="hidden" name="cupcakeId" th:value="${favorito.cupcake.id}">
                        <input type="hidden" name="quantidade" value="1">
                        <button type="submit" class="w-full rounded-lg bg-rose-600 px-3 py-2 text-sm font-semibold text-white hover:bg-rose-700">Adicionar ao carrinho</button>
                    </form>
                    <form th:action="@{/cliente/favoritos/remover/{id}(id=${favorito.id})}" method="post">
                        <button type="submit" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 hover:border-red-300 hover:text-red-600">Remover</button>
                    </form>
                </div>
            </div>
        </article>
    </div>
</main>
</body>
</html>
