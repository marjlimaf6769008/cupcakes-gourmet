<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido confirmado | Cupcakes Gourmet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-rose-50 text-slate-800">
<main class="mx-auto max-w-2xl px-4 py-12 sm:px-6">
    <div class="rounded-3xl bg-white p-6 text-center shadow-sm ring-1 ring-rose-100 sm:p-10">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-3xl text-green-600">✓</div>
        <p class="mt-5 text-sm font-semibold uppercase tracking-wider text-green-600">Pagamento aprovado</p>
        <h1 class="mt-2 text-3xl font-extrabold">Pedido confirmado!</h1>
        <p class="mt-2 text-slate-600">Obrigado pela sua compra. Este é o seu comprovativo.</p>

        <div class="mt-8 rounded-2xl bg-slate-50 p-5 text-left">
            <div class="flex justify-between border-b border-slate-200 pb-4">
                <span class="text-slate-500">Pedido</span>
                <strong th:text="${'#' + pedido.id}">#1</strong>
            </div>
            <div class="flex justify-between border-b border-slate-200 py-4">
                <span class="text-slate-500">Data</span>
                <span th:text="${#temporals.format(pedido.data, 'dd/MM/yyyy HH:mm')}">23/10/2026 12:00</span>
            </div>
            <div class="flex justify-between border-b border-slate-200 py-4">
                <span class="text-slate-500">Status</span>
                <span class="rounded-full bg-amber-100 px-3 py-1 text-sm font-bold text-amber-700"
                      th:text="${pedido.status == T(br.com.cupcakesgourmet.model.entity.Pedido.Status).EM_PREPARO ? 'Em preparo' : pedido.status}">Em preparo</span>
            </div>
            <div class="border-b border-slate-200 py-4 text-sm">
                <p class="font-bold text-slate-700">Entrega para <span th:text="${pedido.nomeDestinatario}">Destinatário</span></p>
                <p class="mt-1 text-slate-600"
                   th:text="${pedido.logradouroEntrega + ', ' + pedido.numeroEntrega + ' - ' + pedido.bairroEntrega}">Rua, 10 - Centro</p>
                <p class="text-slate-500"
                   th:text="${pedido.cidadeEntrega + '/' + pedido.ufEntrega + ' - CEP ' + pedido.cepEntrega}">Cidade/SP - CEP</p>
                <p class="mt-1 text-slate-500"
                   th:text="${'Contato: ' + pedido.telefoneCliente + ' | CPF: ' + pedido.cpfCliente}">Contato</p>
            </div>
            <div th:each="item : ${pedido.itens}" class="flex justify-between gap-3 py-2 text-sm">
                <span th:text="${item.quantidade + 'x ' + item.cupcake.nome}">1x Red Velvet</span>
                <span th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 2)}">R$ 12,00</span>
            </div>
            <div class="mt-3 flex justify-between border-t border-slate-200 pt-4 text-xl font-extrabold">
                <span>Total</span>
                <span class="text-rose-600" th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 2)}">R$ 12,00</span>
            </div>
        </div>
        <div class="mt-7 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a th:href="@{/cliente/pedidos}" class="rounded-lg bg-rose-600 px-5 py-3 font-semibold text-white hover:bg-rose-700">Acompanhar meus pedidos</a>
            <a th:href="@{/catalogo}" class="rounded-lg border border-slate-300 px-5 py-3 font-semibold text-slate-700 hover:bg-slate-50">Voltar ao catálogo</a>
        </div>
    </div>
</main>
</body>
</html>
