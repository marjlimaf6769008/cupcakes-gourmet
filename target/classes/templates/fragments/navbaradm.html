<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbaradm" class="bg-slate-900 text-white shadow">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
        <!--<a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="Cupcakes Gourmet" class="h-11 w-auto">
        </a>-->
        <div>
            <p class="text-xs font-semibold uppercase tracking-widest text-rose-300">Painel administrativo</p>
            <h1 class="text-2xl font-bold">Gestão de cupcakes</h1>
        </div>
        <nav class="flex items-center gap-2 text-sm" aria-label="Navegação principal">
            <div class="relative">
                <button id="menu-toggle" type="button"
                        class="flex items-center gap-2 rounded-full bg-white/15 p-3 transition hover:bg-white/25"
                        aria-controls="account-menu" aria-expanded="false" aria-label="Abrir menu da conta">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         class="h-5 w-5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <span sec:authorize="isAuthenticated()" class="hidden sm:inline"
                          th:text="${#authentication.principal.primeiroNome}">Perfil</span>
                </button>

                <div id="account-menu"
                     class="absolute right-0 z-20 mt-2 hidden w-52 origin-top-right rounded-xl bg-white p-2 text-slate-700 shadow-xl ring-1 ring-black/5 transition duration-150 ease-out"
                     role="menu">
                    <div sec:authorize="isAuthenticated()">
                        <a th:href="@{/admin/pedidos}"     sec:authorize="hasRole('ADMIN')"             class="block rounded-lg px-3 py-2 hover:bg-rose-50 hover:text-rose-700" role="menuitem">Pedidos</a>
                        <a th:href="@{/admin/relatorios}" sec:authorize="hasRole('ADMIN')" class="block rounded-lg px-3 py-2 hover:bg-rose-50 hover:text-rose-700" role="menuitem">Relatórios</a>
                        <a th:href="@{/admin/cupcakes}" sec:authorize="hasRole('ADMIN')" class="block rounded-lg px-3 py-2 hover:bg-rose-50 hover:text-rose-700" role="menuitem">Gestão de produtos</a>
                        <a th:href="@{/catalogo}" class="block rounded-lg px-3 py-2 hover:bg-rose-50 hover:text-rose-700" role="menuitem">Ver catálogo</a>
                        <form th:action="@{/logout}" method="post" class="mt-1 border-t border-slate-100 pt-1">
                            <button type="submit" class="block w-full rounded-lg px-3 py-2 text-left hover:bg-rose-50 hover:text-rose-700" role="menuitem">Sair</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('menu-toggle');
            const menu = document.getElementById('account-menu');

            if (toggleBtn && menu) {
                // Alterna a visibilidade ao clicar no botão
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Evita fechar imediatamente ao clicar
                    menu.classList.toggle('hidden');

                    // Atualiza o atributo acessível aria-expanded
                    const isExpanded = toggleBtn.getAttribute('aria-expanded') === 'true';
                    toggleBtn.setAttribute('aria-expanded', !isExpanded);
                });

                // Fecha o menu se o utilizador clicar fora dele
                document.addEventListener('click', (e) => {
                    if (!menu.contains(e.target) && !toggleBtn.contains(e.target)) {
                        menu.classList.add('hidden');
                        toggleBtn.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        });
    </script>
</header>
</body>
</html>
